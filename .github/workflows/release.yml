# Construit l'exe Windows de Kora et le publie dans les Releases, de deux
# facons : Kora.exe (un seul fichier, tout dedans) et Kora-windows.zip (le
# dossier : demarre plus vite).
# Publier une version : mettre __version__ a jour dans src/kora/__init__.py,
# puis `git tag vX.Y.Z` et `git push --tags`.
# "Run workflow" (onglet Actions) construit l'exe sans rien publier : le zip
# est alors dans les artefacts de l'execution.
# itch.io (facultatif) : avec le secret BUTLER_API_KEY (cle d'API itch) et la
# variable ITCH_GAME ("compte-itch/nom-de-la-page") dans les reglages du
# depot, chaque version est aussi envoyee sur la page itch par butler :
# le canal "windows" (le dossier : l'application itch met le jeu a jour toute
# seule) et le canal "windows-exe" (Kora.exe seul). Sans eux, rien.
name: Publier l'exe Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Les tests dessinent des ecrans sans fenetre.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: La version du jeu correspond a l'etiquette
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(python -c "from src.kora import __version__; print(__version__)")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "L'etiquette $GITHUB_REF_NAME ne correspond pas a __version__ = $v (src/kora/__init__.py)"
            exit 1
          fi

      - name: Tests
        run: python -m pytest -q

      - name: Construire l'exe (dossier)
        run: python -m PyInstaller Kora.spec --noconfirm

      - name: Construire l'exe (un seul fichier)
        run: python -m PyInstaller Kora-unfichier.spec --noconfirm --distpath dist-unfichier --workpath build-unfichier

      - name: Zipper le dossier du jeu
        shell: pwsh
        run: Compress-Archive -Path dist/Kora -DestinationPath Kora-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Kora-windows
          path: |
            Kora-windows.zip
            dist-unfichier/Kora.exe

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-unfichier/Kora.exe Kora-windows.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-unfichier/Kora.exe Kora-windows.zip --title "Kora $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          fi

      - name: Envoyer sur itch.io
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_GAME" ]; then
            echo "Pas de cle ou de page itch.io (BUTLER_API_KEY, ITCH_GAME) : rien a envoyer."
            exit 0
          fi
          curl -sSL -o butler.zip https://broth.itch.ovh/butler/windows-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          v="${GITHUB_REF_NAME#v}"
          ./butler/butler.exe push dist/Kora "$ITCH_GAME:windows" --userversion "$v"
          mkdir -p itch-exe && cp dist-unfichier/Kora.exe itch-exe/
          ./butler/butler.exe push itch-exe "$ITCH_GAME:windows-exe" --userversion "$v"
